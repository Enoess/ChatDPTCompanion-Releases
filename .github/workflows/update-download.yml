name: Update download link

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update download links in index.html
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          perl -CSD -i -pe "s|releases/download/v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*/ChatDPTCompanion-[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*-Setup\.exe|releases/download/${TAG}/ChatDPTCompanion-${VERSION}-Setup.exe|g" index.html
          perl -CSD -i -pe "s/v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*/v${VERSION}/g" index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update download link to v${{ steps.version.outputs.version }}"
          git push
